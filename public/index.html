<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16352f">
  <title>氣功修練中心</title>
  <style>
    :root { --ink:#17342d; --paper:#f2eddf; --card:#fffdf6; --jade:#287060; --jade-dark:#174d43; --gold:#be8a3c; --muted:#6d766f; --line:#d9d2c2; --danger:#a33a32; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 90% 0,#d6e4d6 0,transparent 32rem),var(--paper); font-family:"Noto Serif TC","Songti TC",serif; }
    header { padding:24px 20px 18px; background:linear-gradient(145deg,#102d28,#205a4e); color:#fffdf2; border-bottom:4px solid var(--gold); }
    .header-top { max-width:680px; margin:auto; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    header .eyebrow { color:#d8c18c; letter-spacing:.18em; font-size:12px; }
    header h1 { margin:7px 0 4px; font-size:28px; font-weight:600; }
    header p { margin:0; opacity:.76; font-size:14px; }
    .language { width:auto; min-width:126px; padding:8px; color:#fff; background:#ffffff18; border-color:#ffffff55; }
    .language option { color:#17342d; background:#fff; }
    nav { display:grid; grid-template-columns:repeat(4,1fr); position:sticky; top:0; z-index:10; background:rgba(242,237,223,.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    nav button { border:0; border-bottom:3px solid transparent; padding:13px 4px 10px; background:none; color:var(--muted); font:600 13px system-ui,sans-serif; }
    nav button.active { color:var(--jade-dark); border-color:var(--gold); }
    main { max-width:720px; margin:auto; padding:18px 16px 72px; }
    section { display:none; }
    section.active { display:block; }
    .card { padding:18px; margin-bottom:14px; background:var(--card); border:1px solid rgba(190,138,60,.22); border-radius:6px 18px 6px 18px; box-shadow:0 8px 24px rgba(23,52,45,.07); }
    h2 { margin:0 0 12px; font-size:18px; }
    .status { padding:11px 13px; border-left:4px solid var(--gold); background:#f6efd9; font:14px/1.5 system-ui,sans-serif; }
    .error { color:var(--danger); border-color:var(--danger); }
    .success { color:#176044; border-color:#27825e; }
    .method { padding:9px 0; border-bottom:1px solid #ebe5d8; }
    .method:last-child { border:0; }
    .method-line { display:flex; align-items:center; gap:8px; }
    .method label { display:flex; align-items:center; gap:9px; flex:1; font-size:16px; }
    .children { margin:7px 0 0 30px; display:grid; gap:9px; color:#3d554f; }
    .toggle { width:28px; height:28px; border:1px solid var(--line); border-radius:50%; background:#fff; color:var(--jade-dark); }
    input[type=checkbox] { width:18px; height:18px; accent-color:var(--jade); }
    textarea,select { width:100%; border:1px solid var(--line); border-radius:8px; background:#fff; padding:12px; color:var(--ink); font:15px/1.5 system-ui,sans-serif; }
    textarea { min-height:92px; resize:vertical; }
    .primary { width:100%; padding:14px; border:0; border-radius:4px 14px 4px 14px; background:var(--jade-dark); color:#fff; font:700 16px system-ui,sans-serif; }
    .primary:disabled { opacity:.55; }
    .return-link { display:block; margin-top:10px; text-align:center; text-decoration:none; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
    .stat { padding:16px 6px; background:#edf3ed; border-radius:4px 12px; }
    .stat strong { display:block; font:700 24px system-ui,sans-serif; color:var(--jade-dark); }
    .stat span { font:12px system-ui,sans-serif; color:var(--muted); }
    .history { padding:14px 0; border-bottom:1px solid var(--line); }
    .history:last-child { border:0; }
    .history time { font:700 13px system-ui,sans-serif; color:var(--gold); }
    .history p { margin:5px 0 0; line-height:1.55; }
    .history-note { white-space:pre-wrap; }
    .switch-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .switch-row input { width:22px; height:22px; accent-color:var(--jade); }
    .field { margin:14px 0; }
    .field label { display:block; margin-bottom:6px; color:var(--muted); font:13px system-ui,sans-serif; }
    .level-head,.month-nav { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .level-head .eyebrow { color:var(--gold); letter-spacing:.12em; font:12px system-ui,sans-serif; }
    .level-name { font:700 25px system-ui,sans-serif; color:var(--jade-dark); }
    .progress-track { height:10px; margin:13px 0 8px; overflow:hidden; border-radius:999px; background:#dfe7df; }
    .progress-bar { height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--jade),var(--gold)); transition:width .25s ease; }
    .badge-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .badge { min-height:116px; padding:13px; border:1px solid #e8dfcb; border-radius:5px 15px; background:#fff; }
    .badge .emoji { font-size:25px; }
    .badge strong { display:block; margin:5px 0; font:700 14px system-ui,sans-serif; }
    .badge small { color:var(--muted); font:12px/1.4 system-ui,sans-serif; }
    .month-nav button { min-width:42px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--jade-dark); }
    .month-nav button:disabled { opacity:.35; }
    .calendar-weekdays,.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
    .calendar-weekdays { margin:15px 0 6px; color:var(--muted); text-align:center; font:11px system-ui,sans-serif; }
    .calendar-day { aspect-ratio:1; border:0; border-radius:50%; background:transparent; color:var(--ink); font:13px system-ui,sans-serif; }
    .calendar-day.checked { background:var(--jade); color:#fff; font-weight:700; box-shadow:0 2px 8px #28706055; }
    .calendar-day.selected { outline:3px solid var(--gold); outline-offset:1px; }
    .calendar-day.blank { pointer-events:none; }
    .calendar-summary { margin-top:12px; color:var(--muted); text-align:center; font:13px system-ui,sans-serif; }
    .segments { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:4px; margin-bottom:14px; border-radius:12px; background:#e7e4d8; }
    .segments button { padding:9px; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:700; }
    .segments button.active { background:var(--card); color:var(--jade-dark); box-shadow:0 2px 8px #17342d22; }
    .analysis-bars { display:grid; gap:11px; margin:16px 0; }
    .analysis-row { display:grid; grid-template-columns:minmax(90px,1fr) 2fr 42px; align-items:center; gap:8px; font:12px system-ui,sans-serif; }
    .analysis-track { height:9px; overflow:hidden; border-radius:999px; background:#e2e8df; }
    .analysis-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--jade),#65a77f); }
    .analysis-review { margin-top:12px; white-space:pre-wrap; }
    .disclaimer { margin:12px 0 0; color:var(--muted); font:11px/1.5 system-ui,sans-serif; }
    @media (max-width:420px) { header { padding-inline:14px; } main { padding-inline:12px; } .card { padding:15px; } .stats { gap:5px; } .language { min-width:112px; } }
  </style>
</head>
<body>
  <header><div class="header-top"><div><div id="eyebrow" class="eyebrow">每日練功 · 積微成著</div><h1 id="pageTitle">氣功修練中心</h1><p id="dateLabel">載入中</p></div><select id="language" class="language" aria-label="Language"><option value="zh_TW">繁體中文</option><option value="zh_CN">简体中文</option><option value="en">English</option></select></div></header>
  <nav><button id="tabCheckin" class="active" data-tab="checkin">打卡</button><button id="tabStats" data-tab="stats">統計</button><button id="tabHistory" data-tab="history">紀錄</button><button id="tabReminders" data-tab="reminders">提醒</button></nav>
  <main>
    <section id="checkin" class="active">
      <div class="card"><div id="todayStatus" class="status">正在載入今日資料...</div></div>
      <div class="card"><h2 id="methodsTitle">今日功法</h2><div id="methods"></div></div>
      <div class="card"><h2 id="practiceNoteTitle">練功心得與身體感受（選填）</h2><textarea id="practiceNote" maxlength="1000" placeholder="記錄今天練功的心得、身體感受或其他體會"></textarea></div>
      <button id="submit" class="primary">完成今日打卡</button><div id="submitStatus" class="status" hidden></div><a id="returnToWhatsApp" class="primary return-link" href="/whatsapp/webapp/return" hidden>回到 WhatsApp</a>
    </section>
    <section id="stats">
      <div class="card"><div class="level-head"><div><div id="levelLabel" class="eyebrow">目前境界</div><div id="levelName" class="level-name">練氣</div></div><strong id="levelNumber">Lv. 1</strong></div><div class="progress-track"><div id="levelProgress" class="progress-bar"></div></div><div id="levelNext" class="calendar-summary"></div></div>
      <div class="card"><h2 id="statsTitle">修練累積</h2><div class="stats"><div class="stat"><strong id="currentStreak">0</strong><span id="currentLabel">目前連續</span></div><div class="stat"><strong id="longestStreak">0</strong><span id="longestLabel">最長連續</span></div><div class="stat"><strong id="totalCheckins">0</strong><span id="totalLabel">累計天數</span></div></div><p id="lastCheckin" class="status">尚無紀錄</p></div>
      <div class="card"><h2 id="analysisTitle">功法分析</h2><div class="segments"><button id="analysis30" class="active" type="button">30 天</button><button id="analysis90" type="button">90 天</button></div><div class="stats"><div class="stat"><strong id="analysisAttendance">0%</strong><span id="analysisAttendanceLabel">出席率</span></div><div class="stat"><strong id="analysisDays">0</strong><span id="analysisDaysLabel">打卡天數</span></div><div class="stat"><strong id="analysisJournal">0</strong><span id="analysisJournalLabel">心得天數</span></div></div><p id="analysisTrend" class="status">切換到統計頁後載入分析。</p><div id="analysisBars" class="analysis-bars"></div><button id="generateCommentary" class="primary" type="button">產生練功點評</button><div id="analysisReview" class="status analysis-review" hidden></div><p id="analysisDisclaimer" class="disclaimer">點評僅供練功紀錄參考，不構成醫療建議。</p></div>
      <div class="card"><div class="level-head"><h2 id="badgesTitle">榮譽勳章</h2><span id="badgeCount"></span></div><div id="badgeGrid" class="badge-grid"></div><p id="badgeEmpty" class="calendar-summary">持續打卡，解鎖第一枚勳章。</p></div>
    </section>
    <section id="history">
      <div class="card"><div class="month-nav"><button id="prevMonth" type="button" aria-label="Previous month">‹</button><h2 id="calendarMonth"></h2><button id="nextMonth" type="button" aria-label="Next month">›</button></div><div id="calendarWeekdays" class="calendar-weekdays"></div><div id="calendarGrid" class="calendar-grid"></div><div id="calendarSummary" class="calendar-summary"></div></div>
      <div class="card"><h2 id="historyTitle">本月打卡紀錄</h2><div id="historyList">正在載入...</div></div>
    </section>
    <section id="reminders"><div class="card"><h2 id="remindersTitle">每日提醒</h2><div class="switch-row"><span id="reminderAllow">允許每日打卡提醒</span><input type="checkbox" id="reminderEnabled"></div><div class="field"><label id="reminderHourLabel" for="reminderHour">提醒時間</label><select id="reminderHour"></select></div><div class="field"><label id="timezoneLabel" for="reminderTimezone">時區</label><select id="reminderTimezone"><option value="Asia/Taipei"></option><option value="Asia/Hong_Kong"></option><option value="Asia/Singapore"></option><option value="America/Los_Angeles"></option></select></div><button id="saveReminder" class="primary">儲存提醒設定</button><div id="reminderStatus" class="status" hidden></div></div></section>
  </main>
  <script>
    const translations = {

      zh_CN: { htmlLang:'zh-Hans', pageTitle:'气功修练中心', eyebrow:'每日练功 · 积微成著', loading:'加载中', requestFailed:'请求失败', tabCheckin:'打卡', tabStats:'统计', tabHistory:'记录', tabReminders:'提醒', methodsTitle:'今日功法', practiceNoteTitle:'练功心得与身体感受（选填）', practiceNotePlaceholder:'记录今天练功的心得、身体感受或其他体会', submit:'完成今日打卡', statsTitle:'练功累计', currentLabel:'目前连续', longestLabel:'最长连续', totalLabel:'累计天数', noRecord:'尚无打卡记录', recent:'最近打卡', historyTitle:'本月打卡记录', remindersTitle:'每日提醒', reminderAllow:'允许每日打卡提醒', reminderHourLabel:'提醒时间', timezoneLabel:'时区', saveReminder:'保存提醒设置', todayDone:'今日已打卡，可修改内容后再次提交。', todayPending:'今日尚未打卡，选择功法后完成记录。', selectMethod:'请至少选择一个功法。', checkinDone:'打卡完成', practiceNotePrefix:'心得与感受', reminderSaved:'提醒设置已保存。', levelLabel:'目前境界', badgesTitle:'荣誉勋章', badgeEmpty:'持续打卡，解锁第一枚勋章。', badgeCount:(earned,total)=>`${earned} / ${total}`, levelNext:(name,days)=>`距离 ${name} 还有 ${days} 天`, maxLevel:'已达目前最高境界', monthDays:(days)=>`本月打卡 ${days} 天`, weekdays:['日','一','二','三','四','五','六'], levelNames:{qi:'练气',foundation:'筑基',core:'结丹',mastery:'化境'}, timezones:['台北','香港','新加坡','美国西部'] },
      en: { htmlLang:'en', pageTitle:'Qigong Practice Center', eyebrow:'DAILY PRACTICE · STEADY PROGRESS', loading:'Loading', requestFailed:'Request failed', tabCheckin:'Check in', tabStats:'Stats', tabHistory:'History', tabReminders:'Reminders', methodsTitle:'Today\'s methods', practiceNoteTitle:'Practice reflection and body sensations (optional)', practiceNotePlaceholder:'Record reflections, body sensations, or anything else you noticed', submit:'Complete check-in', statsTitle:'Practice progress', currentLabel:'Current streak', longestLabel:'Longest streak', totalLabel:'Total days', noRecord:'No check-ins yet', recent:'Most recent', historyTitle:'This month\'s check-ins', remindersTitle:'Daily reminder', reminderAllow:'Enable daily check-in reminder', reminderHourLabel:'Reminder time', timezoneLabel:'Time zone', saveReminder:'Save reminder settings', todayDone:'You have checked in today. You can update and submit it again.', todayPending:'No check-in yet today. Select your methods to begin.', selectMethod:'Select at least one practice method.', checkinDone:'Check-in complete', practiceNotePrefix:'Reflection and sensations', reminderSaved:'Reminder settings saved.', levelLabel:'Current level', badgesTitle:'Honor badges', badgeEmpty:'Keep checking in to unlock your first badge.', badgeCount:(earned,total)=>`${earned} / ${total}`, levelNext:(name,days)=>`${days} days until ${name}`, maxLevel:'Highest current level reached', monthDays:(days)=>`${days} check-in days this month`, weekdays:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], levelNames:{qi:'Qi Cultivation',foundation:'Foundation',core:'Inner Core',mastery:'Mastery'}, timezones:['Taipei','Hong Kong','Singapore','US Pacific'] }
    };
    const analysisTranslations = {
      zh_TW: { analysisTitle:'功法分析', analysis30:'30 天', analysis90:'90 天', analysisAttendanceLabel:'出席率', analysisDaysLabel:'打卡天數', analysisJournalLabel:'心得天數', analysisIdle:'切換到統計頁後載入分析。', analysisLoading:'正在載入功法分析...', analysisEmpty:'這個期間尚無功法資料。', analysisTrend:(direction,a,b)=>`前半段 ${a} 天，後半段 ${b} 天；${direction==='up'?'頻率提升':direction==='down'?'頻率減少':'節奏穩定'}。`, generateCommentary:'產生練功點評', generatingCommentary:'正在產生點評...', commentaryFailed:'點評暫時無法產生', analysisDisclaimer:'點評僅供練功紀錄參考，不構成醫療建議。', returningToWhatsApp:'即將嘗試返回 WhatsApp。', returnToWhatsApp:'回到 WhatsApp' },
      zh_CN: { analysisTitle:'功法分析', analysis30:'30 天', analysis90:'90 天', analysisAttendanceLabel:'出席率', analysisDaysLabel:'打卡天数', analysisJournalLabel:'心得天数', analysisIdle:'切换到统计页后加载分析。', analysisLoading:'正在加载功法分析...', analysisEmpty:'这个期间还没有功法资料。', analysisTrend:(direction,a,b)=>`前半段 ${a} 天，后半段 ${b} 天；${direction==='up'?'频率提升':direction==='down'?'频率减少':'节奏稳定'}。`, generateCommentary:'生成练功点评', generatingCommentary:'正在生成点评...', commentaryFailed:'点评暂时无法生成', analysisDisclaimer:'点评仅供练功记录参考，不构成医疗建议。', returningToWhatsApp:'即将尝试返回 WhatsApp。', returnToWhatsApp:'返回 WhatsApp' },
      en: { analysisTitle:'Practice analysis', analysis30:'30 days', analysis90:'90 days', analysisAttendanceLabel:'Attendance', analysisDaysLabel:'Check-in days', analysisJournalLabel:'Journal days', analysisIdle:'Open Stats to load your analysis.', analysisLoading:'Loading practice analysis...', analysisEmpty:'No practice data in this period.', analysisTrend:(direction,a,b)=>`${a} days in the first half, ${b} in the second; frequency is ${direction==='up'?'increasing':direction==='down'?'decreasing':'steady'}.`, generateCommentary:'Generate practice guidance', generatingCommentary:'Generating guidance...', commentaryFailed:'Guidance is temporarily unavailable', analysisDisclaimer:'Guidance is for practice tracking only and is not medical advice.', returningToWhatsApp:'Attempting to return to WhatsApp shortly.', returnToWhatsApp:'Return to WhatsApp' }
    };
    const state = { locale:'zh_TW', methods:[], selected:new Set(), expanded:new Set(), today:null, stats:null, achievements:null, calendar:null, calendarMonth:new Date().toISOString().slice(0,7), selectedDate:null, analysisWindow:30, analyses:{}, analysisRequestId:0, commentaryRequestId:0 };

    const methodName = (method) => state.locale === 'en' ? (method.nameEn || method.nameZh) : state.locale === 'zh_CN' ? (method.nameZhCn || method.nameZh) : method.nameZh;
    const api = async (url, options = {}) => { const headers = new Headers(options.headers || {}); headers.set('x-requested-with','qigong-webapp'); if (options.body) headers.set('content-type','application/json'); const response = await fetch(`/whatsapp/api/webapp${url}`,{...options,headers}); const body = await response.json().catch(()=>({})); if (!response.ok) throw new Error(body.error || text().requestFailed); return body; };
    const showStatus = (target,message,kind='') => { target.hidden=false; target.textContent=message; target.classList.add('status');target.classList.remove('error','success');if(kind)target.classList.add(kind); };
    const setText = (id,value) => { el(id).textContent=value; };
    const applyLocale = () => { const tx=text(); document.documentElement.lang=tx.htmlLang; document.title=tx.pageTitle; ['pageTitle','eyebrow','tabCheckin','tabStats','tabHistory','tabReminders','methodsTitle','practiceNoteTitle','statsTitle','currentLabel','longestLabel','totalLabel','historyTitle','remindersTitle','reminderAllow','reminderHourLabel','timezoneLabel','saveReminder','levelLabel','badgesTitle','badgeEmpty','analysisTitle','analysisAttendanceLabel','analysisDaysLabel','analysisJournalLabel','analysisDisclaimer','returnToWhatsApp'].forEach((id)=>setText(id,tx[id]));setText('analysis30',tx.analysis30);setText('analysis90',tx.analysis90);setText('generateCommentary',tx.generateCommentary);if(!state.analyses[state.analysisWindow])setText('analysisTrend',tx.analysisIdle);el('practiceNote').placeholder=tx.practiceNotePlaceholder;setText('submit',tx.submit);const zones=['Asia/Taipei','Asia/Hong_Kong','Asia/Singapore','America/Los_Angeles'];[...el('reminderTimezone').options].forEach((option,index)=>{option.textContent=`${tx.timezones[index]} (${zones[index]})`;});if(state.today)showStatus(el('todayStatus'),state.today.alreadyCheckedIn?tx.todayDone:tx.todayPending);if(state.stats)renderStats(state.stats);if(state.achievements)renderAchievements(state.achievements);if(state.calendar)renderCalendar(state.calendar);if(state.analyses[state.analysisWindow])renderAnalysis(state.analyses[state.analysisWindow]);renderMethods(); };
    document.querySelectorAll('nav button').forEach((button)=>button.addEventListener('click',()=>{ document.querySelectorAll('nav button,main section').forEach((item)=>item.classList.remove('active')); button.classList.add('active'); el(button.dataset.tab).classList.add('active'); }));
    const renderMethods = () => { const container=el('methods'); container.replaceChildren(); state.methods.forEach((method)=>{ const block=document.createElement('div'); block.className='method'; const line=document.createElement('div'); line.className='method-line'; if(method.children.length){ const toggle=document.createElement('button'); toggle.className='toggle'; toggle.type='button'; toggle.textContent=state.expanded.has(method.id)?'−':'+'; toggle.addEventListener('click',()=>{state.expanded.has(method.id)?state.expanded.delete(method.id):state.expanded.add(method.id);renderMethods();}); line.append(toggle); }else line.append(document.createElement('span')); const label=document.createElement('label'); const checkbox=document.createElement('input'); checkbox.type='checkbox'; const childIds=method.children.map((child)=>child.id); checkbox.checked=method.children.length?childIds.every((id)=>state.selected.has(id)):state.selected.has(method.id); checkbox.indeterminate=method.children.length&&childIds.some((id)=>state.selected.has(id))&&!checkbox.checked; checkbox.addEventListener('change',()=>{(method.children.length?childIds:[method.id]).forEach((id)=>checkbox.checked?state.selected.add(id):state.selected.delete(id));renderMethods();}); label.append(checkbox,document.createTextNode(methodName(method))); line.append(label); block.append(line); if(method.children.length&&state.expanded.has(method.id)){ const children=document.createElement('div'); children.className='children'; method.children.forEach((child)=>{const childLabel=document.createElement('label');const childBox=document.createElement('input');childBox.type='checkbox';childBox.checked=state.selected.has(child.id);childBox.addEventListener('change',()=>{childBox.checked?state.selected.add(child.id):state.selected.delete(child.id);renderMethods();});childLabel.append(childBox,document.createTextNode(methodName(child)));children.append(childLabel);});block.append(children);} container.append(block); }); };
    const renderStats = (stats) => { state.stats=stats; setText('currentStreak',stats.currentStreak); setText('longestStreak',stats.longestStreak); setText('totalCheckins',stats.totalCheckins); setText('lastCheckin',stats.lastCheckinDate?`${text().recent}: ${stats.lastCheckinDate}`:text().noRecord); };
    const renderAnalysis = (data) => { state.analyses[data.periodDays]=data;state.analysisWindow=data.periodDays;el('analysis30').classList.toggle('active',data.periodDays===30);el('analysis90').classList.toggle('active',data.periodDays===90);setText('analysisAttendance',`${(data.attendanceRate*100).toFixed(0)}%`);setText('analysisDays',data.totalCheckinDays);setText('analysisJournal',data.journalDays);showStatus(el('analysisTrend'),text().analysisTrend(data.trend.direction,data.trend.firstHalfDays,data.trend.secondHalfDays));const bars=el('analysisBars');bars.replaceChildren();if(!data.groupMethods.length){bars.textContent=text().analysisEmpty;return;}data.groupMethods.slice(0,8).forEach((method)=>{const row=document.createElement('div');row.className='analysis-row';const name=document.createElement('span');name.textContent=method.methodName;const track=document.createElement('div');track.className='analysis-track';const fill=document.createElement('div');fill.className='analysis-fill';fill.style.width=`${Math.max(2,method.compositionRatio*100)}%`;track.append(fill);const ratio=document.createElement('span');ratio.textContent=`${(method.compositionRatio*100).toFixed(0)}%`;row.append(name,track,ratio);bars.append(row);}); };
    const resetCommentary = () => { state.commentaryRequestId+=1;el('analysisReview').hidden=true;el('generateCommentary').disabled=false;setText('generateCommentary',text().generateCommentary); };
    const loadAnalysis = async (windowDays=state.analysisWindow) => { const requestId=++state.analysisRequestId;const locale=state.locale;state.analysisWindow=windowDays;resetCommentary();el('analysis30').classList.toggle('active',windowDays===30);el('analysis90').classList.toggle('active',windowDays===90);setText('analysisAttendance','0%');setText('analysisDays','0');setText('analysisJournal','0');el('analysisBars').replaceChildren();showStatus(el('analysisTrend'),text().analysisLoading);try{const data=await api(`/analysis?window=${windowDays}`);if(requestId===state.analysisRequestId&&windowDays===state.analysisWindow&&locale===state.locale)renderAnalysis(data);}catch(error){if(requestId===state.analysisRequestId)showStatus(el('analysisTrend'),error.message,'error');} };
    const selectAnalysisWindow = (windowDays) => { state.analysisRequestId+=1;state.analysisWindow=windowDays;resetCommentary();if(state.analyses[windowDays])renderAnalysis(state.analyses[windowDays]);else loadAnalysis(windowDays); };
    const generateCommentary = async () => { const requestId=++state.commentaryRequestId;const windowDays=state.analysisWindow;const locale=state.locale;const button=el('generateCommentary');button.disabled=true;setText('generateCommentary',text().generatingCommentary);showStatus(el('analysisReview'),text().generatingCommentary);try{const result=await api('/analysis/commentary',{method:'POST',body:JSON.stringify({window:windowDays})});if(requestId===state.commentaryRequestId&&windowDays===state.analysisWindow&&locale===state.locale)showStatus(el('analysisReview'),result.text,result.source==='llm'?'success':'');}catch(error){if(requestId===state.commentaryRequestId)showStatus(el('analysisReview'),`${text().commentaryFailed}: ${error.message}`,'error');}finally{if(requestId===state.commentaryRequestId){button.disabled=false;setText('generateCommentary',text().generateCommentary);}} };
    const renderAchievements = (data) => { state.achievements=data;const tx=text();setText('levelName',data.level.title||tx.levelNames[data.level.code]);setText('levelNumber',`Lv. ${data.level.level}`);el('levelProgress').style.width=`${data.level.progressPercent}%`;setText('levelNext',data.level.nextTitle?tx.levelNext(data.level.nextTitle,data.level.remaining):tx.maxLevel);setText('badgeCount',tx.badgeCount(data.earnedCount,data.totalAvailable));const grid=el('badgeGrid');grid.replaceChildren();el('badgeEmpty').hidden=data.badges.length>0;data.badges.forEach((badge)=>{const card=document.createElement('article');card.className='badge';const emoji=document.createElement('div');emoji.className='emoji';emoji.textContent=badge.emoji;const name=document.createElement('strong');name.textContent=`${badge.name}${badge.earnedYear?` · ${badge.earnedYear}`:''}`;const description=document.createElement('small');description.textContent=badge.description;card.append(emoji,name,description);grid.append(card);}); };
    const monthLabel = (month) => { const [year,value]=month.split('-').map(Number);return new Intl.DateTimeFormat(state.locale==='en'?'en':state.locale==='zh_CN'?'zh-CN':'zh-TW',{year:'numeric',month:'long',timeZone:'UTC'}).format(new Date(Date.UTC(year,value-1,1))); };
    const shiftMonth = (month,delta) => { const [year,value]=month.split('-').map(Number);const date=new Date(Date.UTC(year,value-1+delta,1));return `${date.getUTCFullYear()}-${String(date.getUTCMonth()+1).padStart(2,'0')}`; };
    const mergeLegacyNotes = (reflection='',bodyFeeling='') => { const reflectionText=String(reflection||'').trim();const bodyFeelingText=String(bodyFeeling||'').trim();return reflectionText&&bodyFeelingText?`${reflectionText}\n${bodyFeelingText}`:reflectionText||bodyFeelingText; };
    const splitLegacyNote = (value) => { const practiceNote=String(value||'');if(practiceNote.length<=1000)return [practiceNote,''];const separator=practiceNote.indexOf('\n');if(separator<=1000&&practiceNote.length-separator-1<=1000)return [practiceNote.slice(0,separator),practiceNote.slice(separator+1)];return [practiceNote.slice(0,1000),practiceNote.slice(1000,2000)]; };
    const renderHistoryEntries = (entries) => { const list=el('historyList');list.replaceChildren();const visible=state.selectedDate?entries.filter((entry)=>entry.date===state.selectedDate):[...entries].reverse();if(!visible.length){list.textContent=text().noRecord;return;}visible.forEach((entry)=>{const row=document.createElement('div');row.className='history';const time=document.createElement('time');time.textContent=entry.date;const methods=document.createElement('p');methods.textContent=entry.methods.join(state.locale==='en'?', ':'、');row.append(time,methods);const practiceNote=entry.practiceNote||mergeLegacyNotes(entry.reflectionNote,entry.bodyFeelingNote);if(practiceNote){const note=document.createElement('p');note.className='history-note';note.textContent=`${text().practiceNotePrefix}: ${practiceNote}`;row.append(note);}list.append(row);}); };
    const renderCalendar = (data) => { state.calendar=data;state.calendarMonth=data.month;setText('calendarMonth',monthLabel(data.month));const currentMonth=state.today?.date.slice(0,7)||new Date().toISOString().slice(0,7);el('nextMonth').disabled=data.month>=currentMonth;const weekdays=el('calendarWeekdays');weekdays.replaceChildren(...text().weekdays.map((value)=>{const span=document.createElement('span');span.textContent=value;return span;}));const checked=new Set(data.checkedInDates);const grid=el('calendarGrid');grid.replaceChildren();for(let index=0;index<data.firstWeekday;index+=1){const blank=document.createElement('span');blank.className='calendar-day blank';grid.append(blank);}for(let day=1;day<=data.daysInMonth;day+=1){const date=`${data.month}-${String(day).padStart(2,'0')}`;const button=document.createElement('button');button.type='button';button.className=`calendar-day${checked.has(date)?' checked':''}${state.selectedDate===date?' selected':''}`;button.textContent=day;button.addEventListener('click',()=>{state.selectedDate=state.selectedDate===date?null:date;renderCalendar(data);});grid.append(button);}setText('calendarSummary',text().monthDays(data.checkedInDates.length));renderHistoryEntries(data.entries); };
    let calendarRequest=0;
    const loadCalendar = async (month=state.calendarMonth) => { const displayed=state.calendar?.month||state.calendarMonth;state.selectedDate=null;state.calendarMonth=month;const request=++calendarRequest;el('prevMonth').disabled=true;el('nextMonth').disabled=true;try{const data=await api(`/calendar?month=${encodeURIComponent(month)}`);if(request===calendarRequest)renderCalendar(data);}catch(error){if(request===calendarRequest){state.calendarMonth=displayed;if(state.calendar)renderCalendar(state.calendar);}throw error;} };
    const loadProgress = async () => renderAchievements(await api('/achievements'));
    let returnTimer,returnFallbackTimer,returnGeneration=0;
    const cancelWhatsAppReturn = () => { returnGeneration+=1;if(returnTimer)clearTimeout(returnTimer);if(returnFallbackTimer)clearTimeout(returnFallbackTimer);returnTimer=undefined;returnFallbackTimer=undefined;el('returnToWhatsApp').hidden=true; };
    const scheduleWhatsAppReturn = () => { const generation=++returnGeneration;el('returnToWhatsApp').hidden=false;returnTimer=setTimeout(()=>{if(generation!==returnGeneration)return;returnTimer=undefined;window.close();returnFallbackTimer=setTimeout(()=>{returnFallbackTimer=undefined;if(generation===returnGeneration&&!document.hidden)window.location.replace('/whatsapp/webapp/return');},150);},1500); };
    const load = async () => { try { const profile=await api('/profile');state.locale=profile.locale;el('language').value=state.locale;applyLocale();const [methods,today,stats,reminders,achievements,calendar]=await Promise.all([api('/practice-methods'),api('/checkin/today'),api('/stats'),api('/reminders'),api('/achievements'),api('/calendar')]);state.methods=methods.methods;state.today=today;state.selected=new Set(today.selectedMethodIds);state.expanded=new Set(state.methods.filter((method)=>method.children.some((child)=>state.selected.has(child.id))).map((method)=>method.id));el('practiceNote').value=today.practiceNote||mergeLegacyNotes(today.reflectionNote,today.bodyFeelingNote);el('dateLabel').textContent=today.date;el('reminderEnabled').checked=reminders.reminderEnabled;el('reminderHour').value=reminders.reminderHour;el('reminderTimezone').value=reminders.reminderTimezone;applyLocale();renderStats(stats);renderAchievements(achievements);renderCalendar(calendar); } catch(error){showStatus(el('todayStatus'),error.message,'error');} };
    for(let hour=0;hour<24;hour+=1){const option=document.createElement('option');option.value=hour;option.textContent=`${String(hour).padStart(2,'0')}:00`;el('reminderHour').append(option);}
    el('language').addEventListener('change',async()=>{const previous=state.locale;const previousAnalyses=state.analyses;const requested=el('language').value;el('language').disabled=true;state.analysisRequestId+=1;state.analyses={};state.locale=requested;resetCommentary();applyLocale();el('submitStatus').hidden=true;el('reminderStatus').hidden=true;try{const saved=await api('/profile/language',{method:'PATCH',body:JSON.stringify({locale:requested})});state.locale=saved.locale;el('language').value=saved.locale;applyLocale();await Promise.all([loadProgress(),loadCalendar()]);if(el('stats').classList.contains('active'))await loadAnalysis();}catch(error){state.locale=previous;state.analyses=previousAnalyses;el('language').value=previous;applyLocale();showStatus(el('todayStatus'),error.message,'error');}finally{el('language').disabled=false;}});
    el('submit').addEventListener('click',async()=>{cancelWhatsAppReturn();if(!state.selected.size)return showStatus(el('submitStatus'),text().selectMethod,'error');el('submit').disabled=true;try{const practiceNote=el('practiceNote').value;const [reflectionNote,bodyFeelingNote]=splitLegacyNote(practiceNote);const result=await api('/checkin',{method:'POST',body:JSON.stringify({methodIds:[...state.selected],practiceNote,reflectionNote,bodyFeelingNote})});state.today={...state.today,alreadyCheckedIn:true};state.analysisRequestId+=1;state.analyses={};resetCommentary();const unlocked=result.newBadges.length?` · ${result.newBadges.map((badge)=>`${badge.emoji} ${badge.name}`).join(state.locale==='en'?', ':'、')}`:'';showStatus(el('submitStatus'),`${text().checkinDone}: ${result.selectedMethods.join(state.locale==='en'?', ':'、')}${unlocked} ${text().returningToWhatsApp}`,'success');showStatus(el('todayStatus'),text().todayDone);renderStats(result.stats);void Promise.allSettled([loadProgress(),loadCalendar()]);scheduleWhatsAppReturn();}catch(error){showStatus(el('submitStatus'),error.message,'error');}finally{el('submit').disabled=false;}});
    el('tabStats').addEventListener('click',()=>{if(!state.analyses[state.analysisWindow])loadAnalysis();});
    el('analysis30').addEventListener('click',()=>selectAnalysisWindow(30));
    el('analysis90').addEventListener('click',()=>selectAnalysisWindow(90));
    el('generateCommentary').addEventListener('click',generateCommentary);
    el('prevMonth').addEventListener('click',()=>loadCalendar(shiftMonth(state.calendarMonth,-1)).catch((error)=>showStatus(el('todayStatus'),error.message,'error')));
    el('nextMonth').addEventListener('click',()=>loadCalendar(shiftMonth(state.calendarMonth,1)).catch((error)=>showStatus(el('todayStatus'),error.message,'error')));
    el('saveReminder').addEventListener('click',async()=>{el('saveReminder').disabled=true;try{await api('/reminders',{method:'PATCH',body:JSON.stringify({reminderEnabled:el('reminderEnabled').checked,reminderHour:Number(el('reminderHour').value),reminderTimezone:el('reminderTimezone').value})});showStatus(el('reminderStatus'),text().reminderSaved,'success');}catch(error){showStatus(el('reminderStatus'),error.message,'error');}finally{el('saveReminder').disabled=false;}});
    load();
  </script>
